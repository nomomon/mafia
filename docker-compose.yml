services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Not published to the host: only the web service's nginx proxy needs to
    # reach it, over the default compose bridge network.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    # No host port bound here on purpose: a reverse-proxy platform (e.g.
    # Dokploy/Traefik) picks which container port to route to via its own
    # dashboard, and a hardcoded `ports:` mapping both fights that and can
    # fail on redeploy with "port is already allocated". For plain
    # `docker compose up` on your own machine, docker-compose.override.yml
    # (auto-merged, and ignored by anything that passes `-f docker-compose.yml`
    # explicitly) adds the host port mapping back.
    expose:
      - "80"
    restart: unless-stopped
    # Dokploy's Traefik instance routes to containers over its own shared
    # Docker network rather than a published host port — a container has to
    # be attached to it to be reachable at all, or Traefik returns a Bad
    # Gateway even though the container itself is healthy. Harmless outside
    # Dokploy: `default` below keeps web<->server working locally too, and if
    # `dokploy-network` doesn't exist (e.g. running this compose file outside
    # Dokploy), just delete this network block and the `networks:` line above.
    networks:
      - default
      - dokploy-network

networks:
  default: {}
  dokploy-network:
    external: true
