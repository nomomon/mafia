services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Not published to the host: only the web service's nginx proxy needs to
    # reach it, over the default compose bridge network.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    # No host port bound here on purpose: a reverse-proxy platform (e.g.
    # Dokploy/Traefik) picks which container port to route to via its own
    # dashboard, and a hardcoded `ports:` mapping both fights that and can
    # fail on redeploy with "port is already allocated". For plain
    # `docker compose up` on your own machine, docker-compose.override.yml
    # (auto-merged, and ignored by anything that passes `-f docker-compose.yml`
    # explicitly) adds the host port mapping back.
    expose:
      - "80"
    restart: unless-stopped
